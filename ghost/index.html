<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuskyDaddy Ghost Box</title>
  <link rel="stylesheet" href="ghost.css?v=2">
</head>
<body>
  <div class="box">
    <h1>HuskyDaddy Ghost Box</h1>
    <p class="subtitle">Halloween Sound System</p>
    <p class="hint">Tap a button to start a scare. Keep this page open.</p>
    <button id="random-scare" class="random" type="button">RANDOM SCARE</button>
    <p id="sound-status" role="status" aria-live="polite">Ready. Choose a sound.</p>
    <div class="player">
      <p id="player-help">If a button stays on Loading, tap Play in the player below.</p>
      <audio id="scary-audio" controls="controls" preload="none" src="sounds/crazy-laugh-1.mp3">Your browser does not support HTML5 audio.</audio>
      <p><a id="direct-sound" href="sounds/crazy-laugh-1.mp3">Open selected sound directly</a></p>
    </div>
    <div class="tests">
      <button id="crazy-laugh-1" type="button">Crazy Laugh 1</button>
      <button id="crazy-laugh-2" type="button">Crazy Laugh 2</button>
      <button id="ghost-howl" type="button">Ghost Howl</button>
      <button id="ghost-cry" type="button">Ghost Cry</button>
      <button id="scream" type="button">Scream</button>
      <button id="creepy-whisper" type="button">Creepy Whisper</button>
      <button id="sinister-laugh" type="button">Sinister Laugh</button>
      <button id="creepy-ghost" type="button">Creepy Ghost</button>
      <button id="ghost-cry-2" type="button">Ghost Cry 2</button>
      <button id="female-cry" type="button">Female Cry</button>
      <button id="baby-zombie" type="button">Baby Zombie</button>
    </div>
    <button id="stop-sound" class="stop" type="button">STOP SOUND</button>
    <noscript><p>Enable JavaScript in Safari to use the sound buttons.</p></noscript>
    <p class="footer">Eleven sounds. One spooky night. &middot; Player v2</p>
  </div>
  <script src="ghost.js?v=2"></script>
</body>
</html>
