  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, "Times New Roman", serif; background: #f7f3eb; color: #1f2933; line-height: 1.6; }
    .navbar { background: #102a43; color: white; padding: 18px 8%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .nav-links { list-style: none; display: flex; gap: 28px; flex-wrap: wrap; }
    .nav-links a { color: white; text-decoration: none; font-size: 15px; }
    .nav-links a:hover { color: #d4af37; }
    .page-header { background: #102a43; color: white; padding: 70px 8%; text-align: center; }
    .page-header h1 { font-size: 42px; margin-bottom: 15px; }
    .page-header p { font-size: 19px; color: #e5e7eb; }
    .module-nav { background: #fffdf8; border-bottom: 1px solid #e5dccb; display: flex; gap: 12px; justify-content: center; padding: 18px; }
    .container { max-width: 1100px; margin: auto; padding: 60px 8%; }
    .module-title { color: #102a43; font-size: 34px; margin: 18px 0 24px; text-align: center; }
    .card { background: white; padding: 32px; border-radius: 10px; box-shadow: 0 8px 24px rgba(16, 42, 67, 0.08); margin-bottom: 28px; }
    .card h2, .card h3 { color: #102a43; margin-bottom: 15px; }
    .card p, .card li { color: #3e4c59; font-size: 17px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 18px; }
    .word-item { background: #f7f3eb; border-left: 4px solid #d4af37; padding: 10px 14px; border-radius: 6px; color: #102a43; font-weight: bold; }
    .word-item em { color: #6b7280; display: block; font-size: 14px; font-weight: normal; margin-top: 2px; }
    .definition { color: #3e4c59; display: block; font-size: 15px; font-weight: normal; margin-top: 5px; }
    .exercise-list { margin-left: 22px; margin-top: 15px; }
    .exercise-list li { margin-bottom: 12px; }
    .blank { font-weight: bold; color: #102a43; border-bottom: 2px solid #d4af37; padding: 0 6px; }
    .word-bank { background: #fffdf8; border-left: 5px solid #d4af37; padding: 18px; border-radius: 8px; margin: 18px 0; color: #3e4c59; }
    .matching-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 18px; }
    .paragraph-box { background: #fffdf8; border-left: 5px solid #d4af37; padding: 22px; border-radius: 8px; margin-top: 18px; }
    details { margin-top: 18px; background: #f7f3eb; padding: 18px; border-radius: 8px; border: 1px solid #e5dccb; }
    summary { cursor: pointer; font-weight: bold; color: #102a43; }
    .next-link { text-align: center; }
    .button { display: inline-block; background: #d4af37; color: #102a43; padding: 13px 24px; border-radius: 4px; text-decoration: none; font-weight: bold; margin: 6px; }
    .button:hover { background: #c19a2e; }
    footer { background: #102a43; color: #e5e7eb; text-align: center; padding: 24px; font-size: 14px; }
    @media (max-width: 800px) {
      .navbar { flex-direction: column; gap: 18px; }
      .nav-links { justify-content: center; }
      .page-header h1 { font-size: 34px; }
      .matching-grid { grid-template-columns: 1fr; }
      .module-nav { flex-direction: column; text-align: center; }
    }
  </style>

  <header class="page-header">
    <h1>SSAT Vocabulary Practice: Lists 6–13</h1>
    <p>Two modules for AL through AX words.</p>
  </header>

  <nav class="module-nav">
    <a class="button" href="#module-1">Module 1: Words 1–33</a>
    <a class="button" href="#module-2">Module 2: Words 34–65</a>
  </nav>

  <main class="container" id="practice-modules"></main>

  <footer>© HuskyDaddy | SSAT Vocabulary Practice</footer>

  <script>
    const moduleOne = [
      ["allusion", "noun", "An indirect reference.", "The poem contains an _____ to a famous Greek myth."],
      ["aloof", "adjective", "Distant, reserved, or emotionally detached.", "Although he seemed _____ at first, he became friendlier during the trip."],
      ["altruism", "noun", "Selfless concern for the well-being of others.", "Her decision to donate the prize money was an act of _____."],
      ["ambience", "noun", "The atmosphere or mood of a place.", "Soft lighting created a peaceful _____ in the library."],
      ["ambiguous", "adjective", "Unclear or open to more than one interpretation.", "The teacher rewrote the _____ instructions so everyone understood them."],
      ["ambivalent", "adjective", "Having mixed or conflicting feelings.", "She felt _____ about moving because she was excited but would miss her friends."],
      ["ameliorate", "verb", "To improve or make a bad situation better.", "The new tutoring program should _____ the students' difficulties."],
      ["amenable", "adjective", "Willing to agree, cooperate, or be influenced.", "The committee was _____ to changing the schedule."],
      ["amenity", "noun", "A useful or pleasant feature that provides comfort.", "The hotel offered a study room as an extra _____ for guests."],
      ["amiable", "adjective", "Friendly, pleasant, and good-natured.", "The _____ guide answered every question patiently."],
      ["amnesty", "noun", "An official pardon for a group of people.", "The government granted _____ to those who surrendered peacefully."],
      ["amoral", "adjective", "Lacking or unconcerned with moral principles.", "The character's _____ choices showed no concern for right or wrong."],
      ["amorous", "adjective", "Showing romantic love or affection.", "The play includes several _____ letters between the main characters."],
      ["amorphous", "adjective", "Without a clear shape, form, or structure.", "The cloud appeared as an _____ mass above the hills."],
      ["anachronism", "noun", "Something placed in a time period where it does not belong.", "A wristwatch in a film about ancient Rome would be an _____."],
      ["analogy", "noun", "A comparison used to explain a similarity.", "The teacher used an _____ between the heart and a pump."],
      ["anarchy", "noun", "Absence of government or a state of disorder.", "Without rules or leadership, the camp descended into _____."],
      ["anecdote", "noun", "A short, interesting story about a real event.", "The speaker began with an amusing _____ from childhood."],
      ["anguish", "noun", "Severe physical or emotional pain.", "The family experienced great _____ while waiting for news."],
      ["animosity", "noun", "Strong hostility or dislike.", "Years of rivalry created _____ between the two teams."],
      ["anomaly", "noun", "Something unusual that does not fit the expected pattern.", "The unusually warm winter was an _____ in the climate record."],
      ["antecedent", "noun", "Something that came before; in grammar, the word a pronoun refers to.", "In the sentence, the noun 'Maria' is the _____ of 'she.'"],
      ["antipathy", "noun", "A strong feeling of dislike.", "He developed an _____ toward dishonesty after the incident."],
      ["antithesis", "noun", "The direct opposite of something.", "Cruelty is the _____ of kindness."],
      ["apartheid", "noun", "A system of enforced racial separation and discrimination.", "Students studied the struggle against _____ in South Africa."],
      ["apathy", "noun", "Lack of interest, enthusiasm, or concern.", "Voter _____ can weaken participation in public life."],
      ["aphorism", "noun", "A short statement expressing a general truth.", "The phrase 'actions speak louder than words' is an _____."],
      ["apocalypse", "noun", "A catastrophic destruction or end of the world.", "The novel imagines an _____ caused by a global disaster."],
      ["apocryphal", "adjective", "Of doubtful truth or authenticity.", "The dramatic story about the inventor may be _____."],
      ["apotheosis", "noun", "The highest point of development or a perfect example.", "The final performance was the _____ of her career."],
      ["appease", "verb", "To calm, satisfy, or bring peace to.", "The coach tried to _____ the frustrated players."],
      ["appreciate", "verb", "To recognize the value or importance of something.", "Readers can _____ the poem more fully after learning its context."],
      ["apprehensive", "adjective", "Anxious or fearful about what may happen.", "He felt _____ before receiving the test results."]
    ];

    const moduleTwo = [
      ["approbation", "noun", "Official approval or strong praise.", "The proposal received the board's _____."],
      ["appropriate", "verb", "To take something for one's own use, often without permission.", "The corrupt official tried to _____ public funds."],
      ["aptitude", "noun", "A natural ability or talent.", "Her _____ for mathematics became clear at an early age."],
      ["arbiter", "noun", "A person with the authority to judge or decide.", "The referee acted as the final _____ in the dispute."],
      ["arbitrary", "adjective", "Based on personal whim rather than reason or a system.", "The _____ rule seemed to have no logical purpose."],
      ["arcane", "adjective", "Known or understood by very few people.", "The manuscript contained _____ symbols that puzzled researchers."],
      ["archaic", "adjective", "Very old or no longer commonly used.", "The word 'thou' is considered _____ in modern English."],
      ["archetype", "noun", "An original model or typical example.", "The hero's journey is a common literary _____."],
      ["ardent", "adjective", "Passionate, enthusiastic, or devoted.", "She was an _____ supporter of public education."],
      ["arduous", "adjective", "Requiring great effort; difficult.", "Climbing the mountain was an _____ task."],
      ["aristocratic", "adjective", "Related to a wealthy or noble ruling class.", "The mansion reflected the family's _____ background."],
      ["artful", "adjective", "Skillful, clever, or sometimes deceptive.", "The lawyer gave an _____ response that avoided the question."],
      ["artifice", "noun", "A clever trick or deceptive device.", "The disguise was an _____ designed to mislead the guards."],
      ["ascendancy", "noun", "A position of dominance or controlling influence.", "The party gained political _____ after the election."],
      ["ascetic", "noun/adjective", "A person who practices strict self-denial; severely simple.", "The monk followed an _____ way of life."],
      ["assiduous", "adjective", "Showing persistent care and hard work.", "Her _____ preparation led to steady improvement."],
      ["assimilate", "verb", "To absorb and understand information or become part of a group.", "Students need time to _____ new vocabulary."],
      ["assuage", "verb", "To make an unpleasant feeling less intense.", "The teacher tried to _____ the child's fears."],
      ["astute", "adjective", "Clever, perceptive, and showing good judgment.", "The _____ investor noticed the hidden risk."],
      ["atheist", "noun", "A person who does not believe in the existence of God.", "The speaker identified himself as an _____."],
      ["attrition", "noun", "A gradual reduction through loss, wear, or pressure.", "Staff _____ left the organization with fewer experienced workers."],
      ["audacity", "noun", "Boldness or a willingness to take daring risks.", "She had the _____ to challenge the unfair decision."],
      ["augment", "verb", "To increase or add to.", "The school hired tutors to _____ its support program."],
      ["auspicious", "adjective", "Favorable and suggesting future success.", "The clear weather made the opening day feel _____."],
      ["austere", "adjective", "Severe, plain, or without luxury.", "The room was _____, containing only a desk and chair."],
      ["autocratic", "adjective", "Exercising absolute and controlling power.", "The _____ leader refused to consult the council."],
      ["autonomous", "adjective", "Independent and self-governing.", "The region became largely _____ after the agreement."],
      ["avarice", "noun", "Extreme greed for wealth.", "The villain's _____ drove him to betray his partners."],
      ["avow", "verb", "To declare openly and confidently.", "She chose to _____ her support for the reform."],
      ["avuncular", "adjective", "Kindly and friendly in the manner of an uncle.", "The coach's _____ manner reassured the younger players."],
      ["awry", "adjective/adverb", "Away from the intended course; wrong.", "The plan went _____ when the equipment failed."],
      ["axiom", "noun", "A statement accepted as self-evidently true.", "In geometry, an _____ serves as a starting principle."]
    ];

    const paragraphs = [
      `At first, the new student seemed <strong>aloof</strong>, but an <strong>amiable</strong>
      classmate improved the room's tense <strong>ambience</strong> by sharing an <strong>anecdote</strong>.
      The story included an <strong>allusion</strong> to an old legend and an <strong>analogy</strong>
      comparing friendship to a bridge. Some details were <strong>ambiguous</strong>, and the narrator
      felt <strong>ambivalent</strong> about whether the tale was true. One part seemed
      <strong>apocryphal</strong>: an <strong>amorphous</strong> shadow appeared beside an
      <strong>anachronism</strong>, a modern clock in a medieval castle. Yet the story's central
      <strong>aphorism</strong> helped everyone <strong>appreciate</strong> its message. It described
      a kingdom collapsing into <strong>anarchy</strong> as if facing an <strong>apocalypse</strong>.
      An <strong>amoral</strong> ruler encouraged <strong>apartheid</strong>, creating
      <strong>animosity</strong>, <strong>antipathy</strong>, and terrible <strong>anguish</strong>.
      His conduct was the <strong>antithesis</strong> of <strong>altruism</strong>. Public
      <strong>apathy</strong> allowed the injustice to continue until one unusual <strong>anomaly</strong>
      changed events. Its <strong>antecedent</strong> was a small protest that grew into a movement.
      An <strong>amorous</strong> prince, once <strong>apprehensive</strong> and unwilling to act,
      became <strong>amenable</strong> to reform. He offered <strong>amnesty</strong> to opponents,
      tried to <strong>appease</strong> the public, and worked to <strong>ameliorate</strong> conditions.
      A public library became the kingdom's most valued <strong>amenity</strong>, and its opening was
      celebrated as the <strong>apotheosis</strong> of the reform era.`,
      `The council greeted the new year as an <strong>auspicious</strong> moment to
      <strong>augment</strong> the town's schools. An <strong>ardent</strong> teacher with an
      <strong>aptitude</strong> for leadership became the plan's most <strong>assiduous</strong>
      advocate. Her <strong>astute</strong> proposal earned official <strong>approbation</strong>,
      although an <strong>autocratic</strong> official tried to <strong>appropriate</strong> the funds.
      An independent <strong>arbiter</strong> rejected his <strong>arbitrary</strong> decision and
      restored the school's <strong>autonomous</strong> control. Researchers then had to
      <strong>assimilate</strong> both <strong>arcane</strong> records and <strong>archaic</strong>
      documents. One text described an <strong>aristocratic</strong> ruler whose
      <strong>avarice</strong> had given his family political <strong>ascendancy</strong>. He used
      <strong>artful</strong> language and every <strong>artifice</strong> available to conceal his
      actions. He was the <strong>archetype</strong> of the corrupt leader, while an
      <strong>ascetic</strong> scholar served as his opposite. The scholar had the
      <strong>audacity</strong> to <strong>avow</strong> that truth mattered more than power.
      An <strong>atheist</strong> historian and an <strong>avuncular</strong> priest both agreed with
      that principle, treating it almost as an <strong>axiom</strong>. Their
      <strong>arduous</strong> investigation suffered from staff <strong>attrition</strong> and nearly
      went <strong>awry</strong>. Still, an <strong>austere</strong> budget did not stop them.
      Clear evidence helped <strong>assuage</strong> public doubt and finally exposed the scheme.`
    ];

    const scrambleOrders = [
      [21, 7, 29, 2, 18, 11, 31, 5, 14, 24, 0, 27, 9, 32, 16, 3, 25, 12, 22, 6, 30, 19, 1, 28, 15, 8, 23, 4, 26, 10, 20, 13, 17],
      [18, 4, 27, 11, 30, 2, 22, 15, 7, 25, 0, 19, 9, 31, 13, 5, 28, 16, 3, 24, 12, 21, 6, 29, 1, 17, 10, 26, 14, 8, 23, 20]
    ];

    const matchingOrders = [
      [15, 4, 20, 8, 30, 1, 12, 27, 5, 22, 10, 18, 2, 31, 7, 25, 13, 0, 29, 17, 23, 6, 21, 14, 32, 9, 24, 3, 28, 11, 19, 16, 26],
      [12, 21, 4, 29, 7, 17, 1, 26, 14, 31, 9, 23, 0, 18, 6, 27, 15, 3, 24, 11, 30, 5, 20, 8, 28, 13, 2, 25, 16, 10, 22, 19]
    ];

    function label(index) {
      const first = Math.floor(index / 26);
      const second = index % 26;
      return (first ? String.fromCharCode(64 + first) : "") + String.fromCharCode(65 + second);
    }

    function renderModule(words, moduleIndex, startNumber) {
      const definitionOrder = matchingOrders[moduleIndex];
      const answerLetters = new Map(definitionOrder.map((wordIndex, position) => [wordIndex, label(position)]));
      const scrambledWords = scrambleOrders[moduleIndex].map(index => words[index][0]).join(", ");
      const wordCards = words.map((item, index) =>
        `<div class="word-item">${startNumber + index}. ${item[0][0].toUpperCase() + item[0].slice(1)}<em>${item[1]}</em><span class="definition">${item[2]}</span></div>`
      ).join("");
      const matchingWords = words.map(item => `<li>${item[0][0].toUpperCase() + item[0].slice(1)} _____</li>`).join("");
      const definitions = definitionOrder.map((wordIndex, position) => `${label(position)}. ${words[wordIndex][2]}<br>`).join("");
      const matchingKey = words.map((item, index) => `${index + 1}-${answerLetters.get(index)}`).join(", ");
      const gapQuestions = words.map(item => `<li>${item[3].replace("_____", '<span class="blank">_____</span>')}</li>`).join("");
      const gapKey = words.map((item, index) => `${index + 1}. ${item[0]}`).join(", ");
      const moduleNumber = moduleIndex + 1;

      return `
        <h2 class="module-title" id="module-${moduleNumber}">Module ${moduleNumber}: ${moduleNumber === 1 ? "AL–AP" : "AP–AX"} Words</h2>
        <section class="card">
          <h2>Vocabulary List: Module ${moduleNumber}</h2>
          <div class="word-grid">${wordCards}</div>
        </section>
        <section class="card">
          <h2>Exercise 1: Matching</h2>
          <p>Match each word with the correct definition.</p>
          <div class="matching-grid">
            <div><h3>Words</h3><ol class="exercise-list">${matchingWords}</ol></div>
            <div class="word-bank">${definitions}</div>
          </div>
          <details><summary>Show Matching Answer Key</summary><p>${matchingKey}</p></details>
        </section>
        <section class="card">
          <h2>Exercise 2: Gap Filling</h2>
          <p>Choose the best word from the word bank to complete each sentence.</p>
          <div class="word-bank">${scrambledWords}</div>
          <ol class="exercise-list">${gapQuestions}</ol>
          <details><summary>Show Gap Filling Answer Key</summary><p>${gapKey}</p></details>
        </section>
        <section class="card">
          <h2>Exercise 3: Paragraph Using All Words</h2>
          <p>Read the paragraph and notice how each vocabulary word is used in context.</p>
          <div class="paragraph-box"><p>${paragraphs[moduleIndex]}</p></div>
        </section>
      `;
    }

    document.getElementById("practice-modules").innerHTML =
      renderModule(moduleOne, 0, 1) +
      renderModule(moduleTwo, 1, 34) +
      `<section class="card next-link">
        <a class="button" href="list1_5.html">Back to Vocabulary Lists 1–5</a>
        <a class="button" href="../ssat.html">Back to SSAT</a>
      <a class="button" href="vocabulary_builder.html?list=list6_13#flashcards">Practice in Vocabulary Builder</a>

      </section>`;
  </script>
</body>
