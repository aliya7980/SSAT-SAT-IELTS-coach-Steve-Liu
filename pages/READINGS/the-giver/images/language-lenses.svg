<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320"><title>Test a label against an event before making a judgement</title><rect width="960" height="320" fill="#eeece6"/><style>text{font-family:Arial,sans-serif;fill:#292929}.small{font-size:18px}.label{font-size:22px;font-weight:600}.muted{fill:#625c54}.line{fill:none;stroke:#7c7770;stroke-width:3}.red{stroke:#963b35}</style><rect x="45" y="105" width="235" height="95" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="162.5" y="140" text-anchor="middle" class="label">A label</text><text x="162.5" y="170" text-anchor="middle" class="small">What is it called?</text><path d="M280 154h70" class="line"/><rect x="360" y="105" width="235" height="95" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="477.5" y="140" text-anchor="middle" class="label">An event</text><text x="477.5" y="170" text-anchor="middle" class="small">What happens?</text><path d="M595 154h70" class="line red"/><rect x="675" y="105" width="235" height="95" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="792.5" y="140" text-anchor="middle" class="label">A judgement</text><text x="792.5" y="170" text-anchor="middle" class="small">Does the label fit?</text></svg>