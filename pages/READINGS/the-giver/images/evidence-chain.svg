<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320"><title>Claim, evidence, explanation and theme form a chain of reasoning</title><rect width="960" height="320" fill="#eeece6"/><style>text{font-family:Arial,sans-serif;fill:#292929}.small{font-size:18px}.label{font-size:22px;font-weight:600}.muted{fill:#625c54}.line{fill:none;stroke:#7c7770;stroke-width:3}.red{stroke:#963b35}</style><rect x="25" y="105" width="210" height="100" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="130.0" y="140" text-anchor="middle" class="label">Claim</text><text x="130.0" y="170" text-anchor="middle" class="small">Your argument</text><rect x="260" y="105" width="210" height="100" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="365.0" y="140" text-anchor="middle" class="label">Evidence</text><text x="365.0" y="170" text-anchor="middle" class="small">A precise detail</text><rect x="495" y="105" width="210" height="100" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="600.0" y="140" text-anchor="middle" class="label">Explanation</text><text x="600.0" y="170" text-anchor="middle" class="small">How it works</text><rect x="730" y="105" width="210" height="100" rx="10" fill="#fff" stroke="#c9c3b9"/><text x="835.0" y="140" text-anchor="middle" class="label">Theme</text><text x="835.0" y="170" text-anchor="middle" class="small">Why it matters</text><path d="M235 154h25m210 0h25m210 0h25" class="line red"/></svg>