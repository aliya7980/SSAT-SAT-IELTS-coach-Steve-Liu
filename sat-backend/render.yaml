services:
  - type: web
    name: huskydaddy-sat-grading
    runtime: node
    plan: starter
    buildCommand: node --version
    startCommand: node sat-backend/server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: SAT_DB_PATH
        value: /var/data/sat.sqlite
      - key: SAT_ALLOWED_ORIGINS
        value: https://www.huskydaddy.com,https://huskydaddy.com
      - key: SAT_TEACHER_PASSWORD_HASH
        sync: false
      - key: SAT_KEYS_JSON
        sync: false
    disk:
      name: sat-private-data
      mountPath: /var/data
      sizeGB: 1
